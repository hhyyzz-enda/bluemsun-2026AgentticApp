[package]
name = "octosense-theme-contract"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Portable, data-only semantic theme package contract for Makepad hosts"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
blake3 = "1.8"
