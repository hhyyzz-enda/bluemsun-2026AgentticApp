[package]
name = "rinx-miniapp-catalog"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 AND MIT"
description = "Rinx's mini-app library: App Hub's signed catalog, read under the OctoSense app contract"

[workspace]

[dependencies]
## The app contract (OctoSense ADR 0005), by version: never an App Hub commit.
octosense-app-contract = "1.2"
## Reading and verifying App Hub's catalog (Rinx's own client, `hub`).
base64 = "0.22"
ed25519-dalek = { version = "3", features = ["rand_core"] }
hex = "0.4"
rand_core = { version = "0.9", features = ["os_rng"] }
ureq = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

# This crate is also tested as its own workspace. Root workspace patches are
# not inherited here; use the same reviewed source until contract 1.2 ships.
[patch.crates-io]
octosense-app-contract = { path = "../../vendor/octosense-app-contract" }
