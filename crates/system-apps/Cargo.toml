[package]
name = "rinx-system-apps"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
[workspace]
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
## The app contract (OctoSense ADR 0005), by version: never an App Hub commit.
octosense-app-contract = "1.2"

# Match the app's contract when this packaging crate runs as its own workspace.
# Remove after contract 1.2 is published (see the vendored provenance note).
[patch.crates-io]
octosense-app-contract = { path = "../../vendor/octosense-app-contract" }
