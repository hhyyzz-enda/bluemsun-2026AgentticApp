## Add these flags onto all target builds cumulatively.
## <https://github.com/rust-lang/cargo/issues/5376#issuecomment-2163350032>
[target.'cfg(all())']
rustflags = ["--cfg", "ruma_identifiers_storage=\"Arc\""]

## This is a little hack that lets `cargo run` on macOS behave like an app bundle,
## which allows things like speech-to-text and permissions prompts to work.
## The script uses ad-hoc development codesigning, so no apple developer account
## is needed.
## If it fails, the script falls back to running the binary directly as normal.
[target.'cfg(target_os = "macos")']
runner = "packaging/run-macos.sh"

## Override the bundle/package ID that Makepad uses by default with Rinx's ID.
[env]
MAKEPAD_BUNDLE_IDENTIFIER = { value = "org.octosense.rinx", force = true }
## The minimum version that Rinx & Makepad support (for speech-to-text and other features).
MACOSX_DEPLOYMENT_TARGET = "11.0"
## Local build fix (Windows): aws-lc-sys 0.32 with the prebuilt-nasm feature
## misses NASM objects under the Visual Studio generator; fall back to
## portable C crypto (OPENSSL_NO_ASM). Harmless on other platforms.
AWS_LC_SYS_NO_ASM = "1"
